skipCrdCheck: true
components:
  aigateway:
    modelsAsAService:
      gateway:
        name: maas-default-gateway
        namespace: openshift-ingress
        annotations:
          ai-grid/maas-gateway-hostname-prefix: maas

operator:
  type: rhoai
  rhoai:
    olm:
      # Nightly catalog (image ref managed in apps/rhoai/nightly.yaml);
      # requires prerequisites distributed by apps/rhoai-prerequisites.
      source: rhoai-catalog-dev
      channel: stable-3.6
      # ACM owns this Red Hat managed Namespace; OSD rejects Argo writes to it.
      createNamespace: false
      # No RELATED_IMAGE_RHAII_* overrides. The operator's own digests resolve
      # through the registry.redhat.io/rhaii -> registry.stage.redhat.io/rhaii
      # mirror, so the serving runtime matches the operator (vLLM 0.31 for a 3.6
      # nightly) instead of the older published 3.5.2 image. That mirror and a
      # registry.stage.redhat.io credential are prerequisites -- without them the
      # operator's digest answers `manifest unknown` on the CDN and a serving pod
      # sits in ImagePullBackOff. See the install guide's step 1.
dependencies:
  opentelemetry:
    olm:
      # Keep aligned with the cert-manager compatibility grant in apps/rhoai-prerequisites/hub/12-otel-cert-manager-policy.yaml.
      namespace: openshift-opentelemetry-operator
      # Leave olm.config unset: that policy adds AI_GRID_CERT_MANAGER_READY to the Subscription's
      # spec.config.env, and an env list rendered here would make Argo and the policy alternately
      # replace it, restarting OTel each time.
# The payload's Grid runtimes. Argo renders these charts, not the operator, so
# they name the images the operator's payload ships.
global:
  relatedImages:
    - name: RELATED_IMAGE_ODH_PRAXIS_AI_GRID_GATEWAY_IMAGE
      value: registry.redhat.io/rhoai/odh-praxis-ai-grid-gateway-rhel9@sha256:6318e9c5e859ede1a1f056c8bc8af27dbbcf8249e1e07a1a06dee729bf9e72f8
