skipCrdCheck: true
components:
  aigateway:
    modelsAsAService:
      gateway:
        name: maas-default-gateway
        namespace: openshift-ingress
        annotations:
          ai-grid/maas-gateway-hostname-prefix: maas

operator:
  type: rhoai
  rhoai:
    olm:
      # Nightly catalog (image ref managed in apps/rhoai/nightly.yaml);
      # requires prerequisites distributed by apps/rhoai-prerequisites.
      source: rhoai-catalog-dev
      channel: stable-3.6
      # ACM owns this Red Hat managed Namespace; OSD rejects Argo writes to it.
      createNamespace: false
      config:
        env:
          # The 3.6 nightly references registry.redhat.io/rhaii digests that are
          # not on the CDN -- all six (vllm-cuda, -cpu, -cpu-pz, -rocm, -gaudi and
          # model-opt-cuda) return `manifest unknown`. Unlike the rhoai operands
          # there is no reachable mirror: `rosa create image-mirror` to
          # quay.io/rhaii resolves, then fails `unauthorized` with the same
          # credential that works for quay.io/rhoai. Pin the published RHAIIS
          # 3.5.2 CPU runtime (tag 3.5.2, release 1791473481) until the nightly's
          # own digests publish. Only the CPU runtime is pinned: this profile
          # serves facebook-opt-125m on vllm-cpu, so the accelerator variants are
          # never pulled. All three keys carry one digest upstream, so all three
          # are set rather than guessing which the template consumes.
          #
          # RE-VERIFY before trusting this on a new fleet: if the nightly's own
          # rhaii digests have published since 2026-11-06, this pins past them and
          # should be dropped. The symptom of needing it is facebook-opt-125m
          # failing to pull with `manifest unknown`.
          - name: RELATED_IMAGE_RHAII_VLLM_CPU_IMAGE
            value: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:db9adba1176fea8d2e6bbc8621ca3e8aa0d69b92036f846af2ac692355114af1
          - name: RELATED_IMAGE_RHAII_VLLM_CPU_FAST_1_IMAGE
            value: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:db9adba1176fea8d2e6bbc8621ca3e8aa0d69b92036f846af2ac692355114af1
          - name: RELATED_IMAGE_RHAII_VLLM_CPU_FAST_2_IMAGE
            value: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:db9adba1176fea8d2e6bbc8621ca3e8aa0d69b92036f846af2ac692355114af1
          # Keep the advertised runtime version honest with the pinned image.
          # These feed opendatahub.io/runtime-version on the rendered
          # LLMInferenceServiceConfig; left alone they would claim the nightly's
          # 0.31.0+rhaiv.2.cpu while serving a 0.24.0 runtime. Read from the
          # image itself: `python3 -c "import vllm; print(vllm.__version__)"`
          # reports 0.24.0+rhaiv.15; the .cpu suffix follows the operator's own
          # naming for these keys. NOTE the gap -- the 3.6 nightly expects vLLM
          # 0.31, so a template that passes newer vLLM flags will fail on this
          # image. Drop the whole rhaii block once the nightly's digests publish.
          - name: RELATED_IMAGE_RHAII_VLLM_CPU_IMAGE_UPSTREAM_VERSION
            value: 0.24.0+rhaiv.15.cpu
          - name: RELATED_IMAGE_RHAII_VLLM_CPU_FAST_1_IMAGE_UPSTREAM_VERSION
            value: 0.24.0+rhaiv.15.cpu
          - name: RELATED_IMAGE_RHAII_VLLM_CPU_FAST_2_IMAGE_UPSTREAM_VERSION
            value: 0.24.0+rhaiv.15.cpu
dependencies:
  opentelemetry:
    olm:
      # Keep aligned with the cert-manager compatibility grant in apps/rhoai-prerequisites/hub/12-otel-cert-manager-policy.yaml.
      namespace: openshift-opentelemetry-operator
# The payload's Grid runtimes. Argo renders these charts, not the operator, so
# they name the images the operator's payload ships.
global:
  relatedImages:
    - name: RELATED_IMAGE_ODH_PRAXIS_AI_GRID_GATEWAY_IMAGE
      value: registry.redhat.io/rhoai/odh-praxis-ai-grid-gateway-rhel9@sha256:fa06fe6911c549583c8870c8ac5cae094108c40889357e273f313888b71d6633
