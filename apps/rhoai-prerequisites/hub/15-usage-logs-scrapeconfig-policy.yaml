# The usage-log collector's own telemetry, which is the ONLY place a dropped usage record is
# recorded. The collector logs "Exporting failed. Dropping data." once and the pod log rotates
# away; the otelcol_* counters below are what survives.
#
# WHY THIS IS A POLICY AND NOT A HUB ScrapeConfig REGISTERED WITH THE ADDON, which is how
# rhai-metrics and ai-grid-dashboard-platform-metrics reach the spokes
# (rhoai-prerequisites/hub/13-rhai-metrics-addon-policy.yaml):
#
# MCOA does not copy a ScrapeConfig verbatim. Measured 2026-11-25 by diffing the hub object
# against the spoke copy, it rewrites scheme HTTP to HTTPS and appends scrapeClass ocp-monitoring
# plus a static target of prometheus-user-workload.openshift-user-workload-monitoring.svc:9092.
# The collector's service.telemetry block is a bare prometheus reader on 0.0.0.0:8888 with no TLS,
# and service.telemetry is not one of the 8 keys the RHOAI Monitoring CR exposes, so the target
# cannot be moved to HTTPS either. Every scrape through MCOA therefore fails the handshake.
# rhai-metrics survives the rewrite only because its target really does serve service-CA TLS.
#
# A ScrapeConfig created directly on the spoke is not rewritten. The spoke's PrometheusAgent
# user-workload-metrics-collector selects on scrapeConfigSelector matchLabels
# app.kubernetes.io/component=user-workload-metrics-collector with scrapeConfigNamespaceSelector
# {} -- an empty object, meaning every namespace -- so the label below is sufficient and this can
# live next to the collector it scrapes. Proven end to end 2026-11-25 with a temporary copy of
# this object: up=1, 93 samples scraped, 3 kept, and the series in the hub's Thanos.
#
# The collector's own NetworkPolicy (data-science-usage-logs-collector-allow) already admits :8888
# from anywhere -- its rule with no `from` selector -- so unlike rhai-metrics this needs no
# companion NetworkPolicy in 14-rhai-metrics-network-policy.yaml.
#
# Placement rhoai-metrics-sites is defined in 14-rhai-metrics-network-policy.yaml: the same grid
# membership, and already the Placement used to put objects into this same namespace. The
# ConfigurationPolicy retries until RHOAI creates redhat-ods-monitoring; it must not create that
# operator-owned namespace itself.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: ai-grid-usage-logs-scrape
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: ai-grid-usage-logs-scrape
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: monitoring.rhobs/v1alpha1
                kind: ScrapeConfig
                metadata:
                  name: ai-grid-usage-logs
                  namespace: redhat-ods-monitoring
                  labels:
                    # The only selection mechanism. See the PrometheusAgent note above.
                    app.kubernetes.io/component: user-workload-metrics-collector
                spec:
                  jobName: ai-grid-usage-logs
                  metricsPath: /metrics
                  scrapeInterval: 30s
                  # Not HTTPS: the collector's telemetry reader has no TLS. This is the whole
                  # reason the object is here and not in the addon's config list.
                  scheme: HTTP
                  kubernetesSDConfigs:
                    - role: EndpointSlice
                      namespaces:
                        names: [redhat-ods-monitoring]
                      selectors:
                        - role: EndpointSlice
                          label: kubernetes.io/service-name=data-science-usage-logs-collector-monitoring
                  relabelings:
                    # Service and port name together. Read off all three spokes 2026-11-24: the
                    # monitoring Service and its EndpointSlice both name the 8888 port
                    # "monitoring". There is no __tmp_prometheus_job_name keep rule here, unlike
                    # the addon-distributed jobs: that rule exists to separate a hub-local copy
                    # from its addon copy, and this object has neither.
                    - action: keep
                      sourceLabels: [__meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port_name]
                      regex: data-science-usage-logs-collector-monitoring;monitoring
                    - action: keep
                      sourceLabels: [__meta_kubernetes_endpointslice_endpoint_conditions_ready]
                      regex: 'true'
                    - action: drop
                      sourceLabels: [__meta_kubernetes_endpointslice_endpoint_conditions_terminating]
                      regex: 'true'
                    - action: keep
                      sourceLabels: [__meta_kubernetes_endpointslice_address_target_kind]
                      regex: Pod
                    # Per-replica identity. Both collector replicas hold independent in-memory
                    # queues, so a drop has to be attributable to one pod -- and without this the
                    # two replicas produce identical label sets and collapse to one series in
                    # Thanos. AIGridUsageExportQueueFilling groups by it.
                    - sourceLabels: [__meta_kubernetes_endpointslice_address_target_name]
                      targetLabel: ai_grid_collector_pod
                    # The label the alerts select on, because `job` does not survive the write
                    # path. See charts/ai-grid-o11y/templates/thanos-ruler-usage-logs-rules.yaml.
                    - targetLabel: ai_grid_collection_path
                      replacement: usage-logs-collector
                  metricRelabelings:
                    # Keep only the loss and throughput signals. The collector exposes several
                    # hundred series per pod and none of the rest is load bearing here. The
                    # optional _total suffix is forward compatibility: this collector (0.158.0)
                    # emits these counters unsuffixed.
                    - action: keep
                      sourceLabels: [__name__]
                      regex: 'otelcol_(receiver_(accepted|refused)_log_records|exporter_(sent|send_failed|enqueue_failed)_log_records|exporter_queue_(size|capacity)|process_uptime)(_total)?'
                    - action: labeldrop
                      regex: '(exported_)+(ai_grid_collection_path|ai_grid_collector_pod)|(exported_)*(cluster|clusterID)'
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: ai-grid-usage-logs-scrape
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "3"
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: rhoai-metrics-sites
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: ai-grid-usage-logs-scrape
