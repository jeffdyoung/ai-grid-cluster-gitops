# Register the ScrapeConfigs this fleet adds to ACM's observability addon, without taking ownership
# of the addon's other configs: the existing RHOAI exporter job, the GPU metric the AI Grid
# dashboards need beyond ACM's default list
# (charts/ai-grid-o11y/templates/scrapeconfig-dashboard-platform-metrics.yaml), and the usage-log
# collector's telemetry.
#
# This list -- not the ScrapeConfig's labels -- is what makes MCOA distribute a job. Verified
# 2026-11-24: a ScrapeConfig created with labels byte-identical to rhai-metrics was never copied
# into any spoke's addon-multicluster-observability-addon-deploy-0 ManifestWork, and the addon's
# status.configReferences never listed it, until it was named here. A new job needs BOTH files.
# It also sets installStrategy.type Placements and references the observability operator's
# AddOnDeploymentConfig, so the addon is installable when this Policy creates it first.
# Removing this musthave policy does not withdraw the tuple; deregistration is a separate migration.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: rhoai-metrics-hub
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            local-cluster: "true"
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: rhoai-metrics-addon
  namespace: rhoai-prerequisites
  annotations:
    # Registration is independent of image-mirror compliance; apply it alongside
    # the other wave-4 policies so mirror failures cannot block metrics delivery.
    argocd.argoproj.io/sync-wave: "4"
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-metrics-addon
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: addon.open-cluster-management.io/v1alpha1
                kind: ClusterManagementAddOn
                metadata:
                  name: multicluster-observability-addon
                spec:
                  installStrategy:
                    # If this policy creates the addon before the MultiClusterObservability exists,
                    # the CRD default type Manual applies and nothing reverts it, so the addon (and
                    # the Cluster Observability Operator it brings to the hub) is never installed.
                    type: Placements
                    placements:
                      - name: global
                        namespace: open-cluster-management-global-set
                        configs:
                          - group: monitoring.rhobs
                            resource: scrapeconfigs
                            namespace: open-cluster-management-observability
                            name: rhai-metrics
                          - group: monitoring.rhobs
                            resource: scrapeconfigs
                            namespace: open-cluster-management-observability
                            name: ai-grid-dashboard-platform-metrics
                          # The usage-log collector's own telemetry
                          # (charts/ai-grid-o11y/templates/scrapeconfig-usage-logs-collector.yaml),
                          # which is the only record of a dropped usage record.
                          - group: monitoring.rhobs
                            resource: scrapeconfigs
                            namespace: open-cluster-management-observability
                            name: ai-grid-usage-logs
                          # The addon refuses to apply its manifests without an AddOnDeploymentConfig
                          # reference, and when this policy creates the addon it has no default one.
                          # The observability operator creates this config.
                          - group: addon.open-cluster-management.io
                            resource: addondeploymentconfigs
                            namespace: open-cluster-management-observability
                            name: multicluster-observability-addon
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: rhoai-metrics-addon
  namespace: rhoai-prerequisites
  annotations:
    argocd.argoproj.io/sync-wave: "3"
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: rhoai-metrics-hub
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: rhoai-metrics-addon
