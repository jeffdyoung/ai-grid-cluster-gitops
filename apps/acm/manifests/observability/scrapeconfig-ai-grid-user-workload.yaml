# Grid, MaaS, Limitador, Authorino, Kuadrant, CloudNativePG, MetalLB, EPP and engine series federated from
# each cluster's user-workload Prometheus into the hub's Thanos; generic families limited to our namespaces.
apiVersion: monitoring.rhobs/v1alpha1
kind: ScrapeConfig
metadata:
  name: ai-grid-user-workload-metrics
  namespace: open-cluster-management-observability
  labels:
    # User-workload agent; registered by apps/rhoai-prerequisites/hub/09-observability-addon-policy.yaml.
    # Copied verbatim: no placeholder substitution for user-workload jobs.
    app.kubernetes.io/component: user-workload-metrics-collector
    app.kubernetes.io/part-of: multicluster-observability-addon
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  jobName: ai-grid-user-workload
  metricsPath: /federate
  # The agents' default is 300 s.
  scrapeInterval: 30s
  scheme: HTTPS
  scrapeClass: ocp-monitoring
  params:
    match[]:
          - '{__name__=~"grid_.*"}'
          - '{__name__=~"praxis_.*"}'
          - '{__name__=~"limitador_.*|limited_.*|report_calls"}'
          - '{__name__=~"auth_.*|authorized_.*|authorino_.*"}'
          - '{__name__=~"kuadrant_.*"}'
          - '{__name__=~"cnpg_.*"}'
          - '{__name__=~"metallb_.*|frrk8s_.*"}'
          - '{__name__=~"inference_.*|epp_.*|llm_d_epp_.*|llm_d_.*"}'
          - '{__name__=~"vllm:.*"}'
          # maas-api (its ServiceMonitor on MaaS sites is a separate change):
          # key minting and validation, request latency and rejections, the SubjectAccessReview cache.
          - '{__name__=~"maas_.*|sar_cache_.*|active_.*|datastore_.*|dns_.*|leader_.*",namespace="redhat-ai-gateway-infra"}'
          # The Limitador Redis exporter (hub): latency, clients, memory, evictions, keyspace.
          - '{__name__=~"redis_.*",namespace="limitador-redis"}'
          - '{__name__=~"controller_runtime_.*|workqueue_.*|rest_client_requests_total",namespace=~"redhat-ai-grid|redhat-ai-gateway-infra|models-as-a-service|kuadrant-system|maas-db|redhat-ods-applications|metallb-system"}'
          - '{__name__=~"process_.*|go_goroutines|go_memstats_heap_inuse_bytes|go_memstats_alloc_bytes|go_gc_duration_seconds.*|grpc_server_.*",namespace=~"redhat-ai-grid|redhat-ai-gateway-infra|models-as-a-service|kuadrant-system|maas-db|ai-grid-internal-models|metallb-system"}'
          - '{__name__=~"up|scrape_duration_seconds|scrape_samples_scraped",namespace=~"redhat-ai-grid|redhat-ai-gateway-infra|models-as-a-service|kuadrant-system|maas-db|ai-grid-internal-models|metallb-system|open-cluster-management-agent-addon|open-cluster-management-observability"}'

  staticConfigs:
    - targets:
        - prometheus-user-workload.openshift-user-workload-monitoring.svc:9092
