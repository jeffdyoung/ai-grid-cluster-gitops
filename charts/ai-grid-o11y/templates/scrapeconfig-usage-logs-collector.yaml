# The usage-log collector's own telemetry, which is the ONLY place a dropped usage record is
# recorded. Verified 2026-11-24: nothing scraped :8888 and Thanos held zero otelcol_* series, so
# every drop was invisible -- the collector logs "Exporting failed. Dropping data." once and the
# pod log rotates away.
#
# Same delivery path as scrapeconfig.yaml: MCOA copies ScrapeConfigs from this namespace into each
# managed cluster's agent-addon pool, the local agent scrapes, and the metrics remote-write to the
# hub's Thanos. Confirmed working for the rhai-metrics job (~5.7k series per spoke) with NO entry
# in observability-metrics-custom-allowlist, which does not exist on this fleet.
#
# This file alone does NOT get the job distributed. MCOA copies only the ScrapeConfigs named in
# ClusterManagementAddOn installStrategy.placements[global].configs, which
# apps/rhoai-prerequisites/hub/13-rhai-metrics-addon-policy.yaml maintains. The labels below match
# rhai-metrics but are not the selection mechanism -- measured 2026-11-24, this job sat unreferenced
# on the hub until it was named in that policy. Change both files together.
#
# Unlike scrapeconfig.yaml this is scheme HTTP, not HTTPS: the collector's service.telemetry block
# configures a bare prometheus reader on 0.0.0.0:8888 with no TLS. Its NetworkPolicy
# (data-science-usage-logs-collector-allow) admits :8888 from anywhere -- the rule with no `from`
# selector -- so the local agent can reach it.
apiVersion: monitoring.rhobs/v1alpha1
kind: ScrapeConfig
metadata:
  name: ai-grid-usage-logs
  namespace: open-cluster-management-observability
  labels:
    app.kubernetes.io/component: user-workload-metrics-collector
    app.kubernetes.io/part-of: multicluster-observability-addon
spec:
  jobName: ai-grid-usage-logs
  metricsPath: /metrics
  scrapeInterval: 30s
  scheme: HTTP
  kubernetesSDConfigs:
    - role: EndpointSlice
      namespaces:
        names: [redhat-ods-monitoring]
      selectors:
        - role: EndpointSlice
          label: kubernetes.io/service-name=data-science-usage-logs-collector-monitoring
  relabelings:
    # As in scrapeconfig.yaml: on the hub the agent can select both this source and its addon copy.
    - action: keep
      sourceLabels: [__tmp_prometheus_job_name]
      regex: scrapeConfig/open-cluster-management-agent-addon/ai-grid-usage-logs
    # Service and port name together, as in scrapeconfig.yaml. Read off all three spokes
    # 2026-11-24: the monitoring Service and its EndpointSlice both name the 8888 port
    # "monitoring".
    - action: keep
      sourceLabels: [__meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port_name]
      regex: data-science-usage-logs-collector-monitoring;monitoring
    - action: keep
      sourceLabels: [__meta_kubernetes_endpointslice_endpoint_conditions_ready]
      regex: 'true'
    - action: drop
      sourceLabels: [__meta_kubernetes_endpointslice_endpoint_conditions_terminating]
      regex: 'true'
    - action: keep
      sourceLabels: [__meta_kubernetes_endpointslice_address_target_kind]
      regex: Pod
    # Per-replica identity. Both collector replicas hold independent in-memory queues, so a drop
    # has to be attributable to one pod.
    - sourceLabels: [__meta_kubernetes_endpointslice_address_target_name]
      targetLabel: ai_grid_collector_pod
    - targetLabel: ai_grid_collection_path
      replacement: usage-logs-collector
  metricRelabelings:
    # Keep only the loss and throughput signals. The collector exposes several hundred series per
    # pod and none of the rest is load bearing here. The optional _total suffix is forward
    # compatibility: this collector (0.158.0) emits these counters unsuffixed.
    - action: keep
      sourceLabels: [__name__]
      regex: 'otelcol_(receiver_(accepted|refused)_log_records|exporter_(sent|send_failed|enqueue_failed)_log_records|exporter_queue_(size|capacity)|process_uptime)(_total)?'
    - action: labeldrop
      regex: '(exported_)+(ai_grid_collection_path|ai_grid_collector_pod)|(exported_)*(cluster|clusterID)'
